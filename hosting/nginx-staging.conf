# Place inside the http context after reserving this loopback port.
server {
    listen 127.0.0.1:18080;
    server_name strobisoft.com www.strobisoft.com;
    root /srv/strobisoft/current/public;
    index index.html;
    autoindex off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
